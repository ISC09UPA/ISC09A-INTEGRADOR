# Núcleo hexagonal: Domain, Application e Infrastructure, con sus pruebas.
name: Core (Domain, Application, Infrastructure)

on:
  push:
    branches: [7jaylosmolcafriends-almacen-develop, 7jaylosmolcafriends-almacen-main]
    paths:
      - "Almacen/Backend/src/AlmacenInteligente.Domain/**"
      - "Almacen/Backend/src/AlmacenInteligente.Application/**"
      - "Almacen/Backend/src/AlmacenInteligente.Infrastructure/**"
      - "Almacen/Backend/tests/**"
      - "Almacen/Backend/Directory.Build.props"
      - "Almacen/Backend/global.json"
      - ".github/workflows/7jaylosmolcafriends-almacen-core.yml"
  pull_request:
    branches: [7jaylosmolcafriends-almacen-develop, 7jaylosmolcafriends-almacen-main]
    paths:
      - "Almacen/Backend/src/AlmacenInteligente.Domain/**"
      - "Almacen/Backend/src/AlmacenInteligente.Application/**"
      - "Almacen/Backend/src/AlmacenInteligente.Infrastructure/**"
      - "Almacen/Backend/tests/**"
      - "Almacen/Backend/Directory.Build.props"
      - "Almacen/Backend/global.json"
      - ".github/workflows/7jaylosmolcafriends-almacen-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 7jaylosmolcafriends-almacen-core-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Almacen/Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Almacen/Backend/global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Almacen/Backend/**/*.csproj', 'Almacen/Backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Compilar Infrastructure (incluye Domain y Application)
        run: dotnet build src/AlmacenInteligente.Infrastructure/AlmacenInteligente.Infrastructure.csproj -c Release

      - name: Pruebas de Domain
        run: dotnet test tests/AlmacenInteligente.Domain.Tests/AlmacenInteligente.Domain.Tests.csproj -c Release --logger trx --results-directory TestResults

      - name: Pruebas de Application
        run: dotnet test tests/AlmacenInteligente.Application.Tests/AlmacenInteligente.Application.Tests.csproj -c Release --logger trx --results-directory TestResults

      - name: Subir resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-core
          path: Almacen/Backend/TestResults
          if-no-files-found: ignore
