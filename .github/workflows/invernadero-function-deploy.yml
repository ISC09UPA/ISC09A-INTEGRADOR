name: Invernadero · Deploy Function de ingesta

# Publica ProcesarTelemetria en func-invernadero-kevin (Flex Consumption, .NET 10 isolated)
# cada vez que Invernadero-Develop-V1 recibe cambios de la Function o de los DTOs compartidos.
on:
  push:
    branches:
      - Invernadero-Develop-V1
    paths:
      - 'Invernadero/Backend/InvernaderoInteligente.Functions/**'
      - 'Invernadero/Backend/InvernaderoInteligente.Application/**'
      - '.github/workflows/invernadero-function-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: invernadero-function-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AZURE_FUNCTIONAPP_NAME: func-invernadero-kevin
  FUNCTION_PROJECT: Invernadero/Backend/InvernaderoInteligente.Functions/InvernaderoInteligente.Functions.csproj

jobs:
  deploy:
    name: Publicar Function en Azure
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar (Release)
        run: dotnet publish "$FUNCTION_PROJECT" --configuration Release --output ./publish-func

      - name: Desplegar en Function App (Flex Consumption)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish-func
          sku: flexconsumption
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_INVERNADERO }}
