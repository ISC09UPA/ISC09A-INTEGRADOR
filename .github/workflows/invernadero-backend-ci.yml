
name: Invernadero · Backend CI

on:
  push:
    branches:
      - Invernadero-Develop-V1
      - 'feature/SCRUM-*'
    paths:
      - 'Invernadero/Backend/**'
      - '.github/workflows/invernadero-backend-ci.yml'
  pull_request:
    branches:
      - Invernadero-Develop-V1
    paths:
      - 'Invernadero/Backend/**'
      - '.github/workflows/invernadero-backend-ci.yml'
  workflow_dispatch: {}

# Si llegan dos pushes seguidos a la misma rama cancela la ejecución
concurrency:
  group: invernadero-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: InvernaderoInteligente.slnx

jobs:
  build:
    name: Compilar backend (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Invernadero/Backend

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Caché de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Invernadero/Backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar dependencias
        run: dotnet restore "$SOLUTION"

      - name: Compilar (Release, advertencias visibles)
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      # Se ejecuta solo cuando exista al menos un proyecto de pruebas
      - name: Pruebas unitarias
        run: |
          if find . -name '*Tests.csproj' | grep -q .; then
            dotnet test "$SOLUTION" --configuration Release --no-build --verbosity normal
          else
            echo "No hay proyectos de pruebas todavía; se omite este paso."
          fi
