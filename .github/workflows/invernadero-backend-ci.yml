# =============================================================================
# CI del backend de Invernadero Inteligente (.NET 10)
# Ticket: SCRUM-14
#
# Compila la solución InvernaderoInteligente.slnx en cada push y en cada
# Pull Request hacia la rama de integración del equipo Invernadero.
#
# Aislamiento del monorepo:
#   - Solo se dispara cuando cambian archivos dentro de Invernadero/Backend/
#     (o este mismo workflow), así no consume minutos con cambios de otros
#     equipos ni se ejecuta sobre main.
#   - Todos los comandos corren con working-directory = Invernadero/Backend.
# =============================================================================
name: Invernadero · Backend CI

on:
  push:
    branches:
      - Invernadero-Develop-V1
      - 'feature/SCRUM-*'
    paths:
      - 'Invernadero/Backend/**'
      - '.github/workflows/invernadero-backend-ci.yml'
  pull_request:
    branches:
      - Invernadero-Develop-V1
    paths:
      - 'Invernadero/Backend/**'
      - '.github/workflows/invernadero-backend-ci.yml'
  workflow_dispatch: {}

# Si llegan dos pushes seguidos a la misma rama, cancela la ejecución anterior.
concurrency:
  group: invernadero-backend-${{ github.ref }}
  cancel-in-progress: true

# Principio de mínimo privilegio: el job solo necesita leer el código.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: InvernaderoInteligente.slnx

jobs:
  build:
    name: Compilar backend (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Invernadero/Backend

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Caché de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Invernadero/Backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar dependencias
        run: dotnet restore "$SOLUTION"

      - name: Compilar (Release, advertencias visibles)
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      # Se ejecuta solo cuando exista al menos un proyecto de pruebas (*Tests.csproj).
      - name: Pruebas unitarias
        run: |
          if find . -name '*Tests.csproj' | grep -q .; then
            dotnet test "$SOLUTION" --configuration Release --no-build --verbosity normal
          else
            echo "No hay proyectos de pruebas todavía; se omite este paso."
          fi
