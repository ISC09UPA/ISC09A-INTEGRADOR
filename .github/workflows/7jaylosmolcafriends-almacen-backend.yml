name: Backend CI (API y Blazor)

on:
  push:
    branches: [7jaylosmolcafriends-almacen-develop, 7jaylosmolcafriends-almacen-main]
    paths:
      - "Almacen/Backend/src/**"
      - "Almacen/Backend/Directory.Build.props"
      - "Almacen/Backend/global.json"
      - ".github/workflows/7jaylosmolcafriends-almacen-backend.yml"
  pull_request:
    branches: [7jaylosmolcafriends-almacen-develop, 7jaylosmolcafriends-almacen-main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Almacen/Backend/src/**"
      - "Almacen/Backend/Directory.Build.props"
      - "Almacen/Backend/global.json"
      - ".github/workflows/7jaylosmolcafriends-almacen-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 7jaylosmolcafriends-almacen-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Compilar API y Blazor
    # Los PR en borrador no gastan minutos; corren al marcarlos como listos.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Almacen/Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Almacen/Backend/global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Almacen/Backend/src/**/*.csproj', 'Almacen/Backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Un solo runner: Domain, Application e Infrastructure se compilan una vez y los dos hosts los reutilizan.
      - name: Restaurar
        run: |
          dotnet restore src/AlmacenInteligente.Api/AlmacenInteligente.Api.csproj
          dotnet restore src/AlmacenInteligente.Web/AlmacenInteligente.Web.csproj

      - name: Compilar API
        run: dotnet build src/AlmacenInteligente.Api/AlmacenInteligente.Api.csproj -c Release --no-restore

      - name: Compilar Blazor
        run: dotnet build src/AlmacenInteligente.Web/AlmacenInteligente.Web.csproj -c Release --no-restore

      # Publicar y guardar artefactos solo al integrar en main; en PR y develop basta con compilar.
      - name: Publicar
        if: github.event_name == 'push' && github.ref == 'refs/heads/7jaylosmolcafriends-almacen-main'
        run: |
          dotnet publish src/AlmacenInteligente.Api/AlmacenInteligente.Api.csproj -c Release --no-build -o publish/api
          dotnet publish src/AlmacenInteligente.Web/AlmacenInteligente.Web.csproj -c Release --no-build -o publish/web

      - name: Subir paquetes publicados
        if: github.event_name == 'push' && github.ref == 'refs/heads/7jaylosmolcafriends-almacen-main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: Almacen/Backend/publish
          retention-days: 3
          compression-level: 9
