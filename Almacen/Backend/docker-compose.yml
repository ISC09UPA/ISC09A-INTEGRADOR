# Entorno de desarrollo completo: docker compose up --build
# API en http://localhost:8081, Blazor en http://localhost:8080, Mailpit en http://localhost:8026
# Imágenes de productos en Azurite (emulador de Azure Blob Storage), compartidas por la API y la web.
x-blob: &blob "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: almacen
      POSTGRES_USER: almacen
      POSTGRES_PASSWORD: almacen_dev
    ports:
      - "5433:5432" # 5433 para no chocar con un PostgreSQL local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almacen -d almacen"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8026:8025" # bandeja web
      - "1025:1025" # SMTP

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --location /data
    ports:
      - "10000:10000"
    volumes:
      - blobs:/data

  api:
    build:
      context: .
      dockerfile: src/AlmacenInteligente.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Almacen: Host=postgres;Database=almacen;Username=almacen;Password=almacen_dev
      Correo__Smtp__Host: mailpit
      Correo__Smtp__Puerto: "1025"
      Archivos__Blob__CadenaConexion: *blob
      Notificaciones__UrlWeb: http://localhost:8080
      Jwt__Clave: cambia-esta-clave-de-desarrollo-por-una-de-al-menos-32-caracteres
      Jwt__Emisor: almacen-inteligente
      Jwt__Audiencia: almacen-inteligente-app
      Empresa__Nombre: Almacén inteligente
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      azurite:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: src/AlmacenInteligente.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Almacen: Host=postgres;Database=almacen;Username=almacen;Password=almacen_dev
      Correo__Smtp__Host: mailpit
      Correo__Smtp__Puerto: "1025"
      Archivos__Blob__CadenaConexion: *blob
      Notificaciones__UrlWeb: http://localhost:8080
      Api__Url: http://localhost:8081
      Api__UrlInterna: http://api:8080
      Jwt__Clave: cambia-esta-clave-de-desarrollo-por-una-de-al-menos-32-caracteres
      Jwt__Emisor: almacen-inteligente
      Jwt__Audiencia: almacen-inteligente-app
      Empresa__Nombre: Almacén inteligente
      # Superadmin que se crea al arrancar si no existe ninguno
      Superadmin__Nombre: Administrador
      Superadmin__Correo: admin@almacen.local
      Superadmin__Contrasena: Admin_dev_123
    ports:
      - "8080:8080"
    volumes:
      - llaves:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      azurite:
        condition: service_started

volumes:
  pgdata:
  blobs:
  llaves:
